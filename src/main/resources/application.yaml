spring:
  application:
    name: delivery-service
  profiles:
    active: dev
  config:
    import: 'optional:configserver:'

  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_URL:localhost:5439/delivery_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  kafka:
    bootstrap-servers: ${BOOTSTRAP_SERVERS}
    properties:
      security.protocol: SSL
      ssl.endpoint.identification.algorithm: ""
    ssl:
      trust-store-location: classpath:ssl/kafka.server.truststore.jks
      trust-store-password: ${TRUST_STORE_PASSWORD}
      trust-store-type: PKCS12
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 10000
        max.in.flight.requests.per.connection: 5
        retries: 3
        delivery.timeout.ms: 120000
    consumer:
      group-id: delivery-group
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener:
      ack-mode: manual
      concurrency: 3

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:18761/eureka}

server:
  port: 18099

topics:
  order:
    accepted: ${TOPICS_ORDER_ACCEPTED:dev-order-accepted}
  delivery:
    created: ${TOPICS_DELIVERY_CREATED:dev-delivery-created}
    status-updated: ${TOPICS_DELIVERY_STATUS_UPDATED:dev-delivery-status-updated}

